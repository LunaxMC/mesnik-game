<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мясник — КООПЕРАТИВ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Courier New',monospace; color:#cdcdcd; }
  #game { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:10px 16px; pointer-events:none; z-index:5; text-shadow:0 0 6px #000; font-size:15px; }
  #hud .players { font-size:13px; color:#9fd; }
  #hud .players b { color:#7ff; }
  #status { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); border:1px solid #ff2a2a; padding:22px 34px; text-align:center; z-index:10; font-size:15px; }
  #status button { background:#3a0000; color:#fff; border:1px solid #ff2a2a; padding:10px 26px; font-size:15px; font-family:inherit; cursor:pointer; margin-top:12px; }
  #status.hidden { display:none; }
  #mc { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); font-size:13px; color:#899; text-shadow:0 0 5px #000; pointer-events:none; z-index:5; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="players" id="plist">Подключение…</div><div id="timer"></div></div>
<div id="status">
  <div id="stText">Нажми «Начать», чтобы войти в бойню</div>
  <button id="join">НАЧАТЬ</button>
</div>
<div id="mc">МЫШЬ — осмотреться · W A S D — движение · Shift — бег · E — дверь · F — полный экран</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const plistEl = document.getElementById('plist');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const stTextEl = document.getElementById('stText');
  const joinBtn = document.getElementById('join');

  let W=800,H=600;
  function resize(){ const dpr=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight; canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener('resize',resize); resize();

  const TILE=1;
  // карта (только рендер; стены совпадают с сервером)
  const MAP=[
    "###############################################",
    "#.......................#.....................#",
    "#.#####.#####.#########.#.###################.#",
    "#.#.....#...#.#.......#.#.#.......#.......#...#",
    "#.#.#####D###.###.#####D###.#####.#####D###.#.#",
    "#.#P#.....#...#.#.....#.#.....#.#.....#.....#.#",
    "#D#########.#####.#######.#.###.###.#####.###.##",
    "#.........#.......#.....#.#.#.#.#.#...#.......##",
    "#########.#####D###.#.###D#.#.#D#.#.#####.#####",
    "#.......#.#..####.#.#.#.#.#...#.#.#.....#.....##",
    "#.#####.#.#.#.....#.###D#.#####D#.#.#####.#####",
    "#.#...#.#.#.#.#####.#...#.#...#.#.#.#.#.#.....##",
    "#.#D#.#.#.#D#.....#.#####.###D#.#####.#.###.##.#",
    "#.#.#.#.#....#.###D##.#.....#.....#.#.#.....#.#",
    "#.#.#.#.#.#######.#.####D###.###D##.#.#####.###",
    "#.#.#.#.#.........#.#.....#.#.....#.#.......#.#",
    "#.#.#.#.#########.#.#.#####.#.#####D#######.#.#",
    "#.#.#.#.#.......#.#.#.#...#.#.#.....#.......#.#",
    "#.#.#D#.#.#####.#.#.#D#.#D#.#.#.#####D#####.#.#",
    "#.#.#.#.#.#...#.###.#.#.#.#.#.#.....#.....#.#.#",
    "#.#.#.#.#.#.#.#.....#.#.#.#.#.#####.###.#####.#",
    "#.#.#.#.#.#D##########D##.#.#.....#.#.#.....#.#",
    "#.#.#.#.#.#.....#.....#.#.###.###.#.#.#.#####.#",
    "#.#.#.#.#.#####.###D###.#...#...#.#.#.#.#.....#",
    "#.#.#.#.#.....#.#...#.#.#.###D#.#.#.#D#.#######",
    "#.#C#.#.#####.#.#####.#.#.#.....#.#.#.#.....#.#",
    "#.#.#.#.#...#.#.....#...#D#####.#.#.#.#####.#.#",
    "#.#.#.#.#.#.#.#####.#####.#...#.#.#.#.#.....#.#",
    "#.#.#.#.#.#.#.#.....#.....#.#.#.#.#.#.#.###.#.#",
    "#.#.#.#.#.#.#.#.#####.#####.#D#.#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#.#.....#.....#.#.#.#.#.#.#B#.#.#",
    "#.#.#.#.#.#.#.#.#.#####.#####D#.#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#.#.....#.....#.#.#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#D#####.###D###.#C#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#...#...#.....#.#.#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#####D#####.###D#.#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.......#.....#...#.#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#########.#####D###.#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.........#.....#...##.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#########.###.#######.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#...#...#...#.......#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#D#######D#########D#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.#.......#.........#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.###.###D###.#########.#.#.#.#.#.#.#",
    "#.#.#.#.#.#...#.#.#.#.#.#.........#.#.#.#.#.#.#",
    "#.#.#.#.#.#####.#.#.#.#.#.#########D#.#.#.#.#.#",
    "#.#.#.#.#.......#.#.#.#.#.........#.#.#.#.#.#.#",
    "#.#.#.#.#########.#.#.#.###########.#.#.#.#.#.#",
    "#.#.#.#.......#...#.#.#.#..........#.#.#.#.#.#.#",
    "#.#.#.#####.###.###D###.#.######.##.#.#.#.#.#.#",
    "#.#.#.#...#.#.........#.#........#.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.###D######.#########.#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.......#.....#........#.#.#.#.#.#.#",
    "#.#.#.#.#.#.#######.#####D##########.#.#.#.#.#.#",
    "#.#.#.#.#.#.#.....#.#................##.#.#.#.#",
    "#.#.#.#.#.#.#.#####.#.########.##.#####.#.#.#.#",
    "#.#.#.#.#.#.#.#.....#.#......#.#.#.......#.#.#.#",
    "#.###########.#.#####D########.#.###D#####.#.#.#",
    "#..............#.......#......#.#......#...#...##",
    "###########.#####.#####.######D###########.####",
    "#.......................#.....................#",
    "###############################################",
  ];
  const COLS=MAP[0].length, ROWS=MAP.length;
  function insideMap(tx,ty){ return tx>=0&&ty>=0&&tx<COLS&&ty<ROWS; }
  function isSolid(tx,ty){ return !insideMap(tx,ty)||MAP[ty][tx]==='#'||MAP[ty][tx]==='D'; }
  function isDoor(tx,ty){ return insideMap(tx,ty)&&MAP[ty][tx]==='D'; }

  // сеть
  let ws=null, myId=null, connected=false, joined=false;
  let players={}; // id -> {x,y,dirX,dirY,planeX,planeY,god,closet,dead}
  let butcher={x:3,y:3};

  // локальный игрок (моё движение)
  const me={ x:3.5,y:2.5, dirX:1,dirY:0, planeX:0,planeY:0.66, speed:3.0, runMult:1.6, closet:false, god:false };
  let keys={};
  let lastSend=0, lastTime=performance.now();

  // DEBUG: оголить состояние для проверки (безвредно)
  window.__mp={ get players(){return players;}, get myId(){return myId;}, get me(){return me;}, get butcher(){return butcher;}, get joined(){return joined;} };

  const proto = location.protocol==='https:' ? 'wss://' : 'ws://';
  const wsUrl = proto + location.host; // / (сервер раздаёт и сокеты на том же хосте)

  function connect(){
    try{ ws=new WebSocket(wsUrl); }catch(e){ stTextEl.textContent='Ошибка WebSocket: '+e.message; return; }
    ws.onopen=()=>{ connected=true; stTextEl.textContent='Соединение есть. Нажми «Начать».'; joinBtn.style.display='inline-block'; };
    ws.onmessage=(ev)=>{ try{ handle(JSON.parse(ev.data)); }catch(e){} };
    ws.onclose=()=>{ connected=false; if(joined){ stTextEl.textContent='Связь с сервером потеряна.'; statusEl.classList.remove('hidden'); } };
    ws.onerror=()=>{ stTextEl.textContent='Ошибка соединения. Сервер запущен?'; };
  }

  function handle(msg){
    if(msg.type==='init'){ myId=msg.id; players=msg.players; butcher=msg.butcher; stTextEl.textContent='Вы вошли! Режим: кооператив.'; joinBtn.style.display='none'; joined=true; statusEl.classList.add('hidden'); }
    else if(msg.type==='sync'||msg.type==='move'){ if(msg.players) players=msg.players; if(msg.butcher) butcher=msg.butcher; }
    else if(msg.type==='site'){ }
    else if(msg.type==='door'){ MAP[msg.ty]=MAP[msg.ty].slice(0,msg.tx)+(msg.open?'O':'D')+MAP[msg.ty].slice(msg.tx+1); }
    else if(msg.type==='gameover'){ stTextEl.textContent='Мясник кого-то настиг. Все погибли.'; statusEl.classList.remove('hidden'); joinBtn.style.display='inline-block'; }
  }

  function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }

  // локальный разделение движения/коллизий (сверяем с картой, грубо)
  function localStep(dt){
    const run=keys['ShiftLeft']||keys['ShiftRight'];
    const spd=me.speed*(run?me.runMult:1);
    let mx=0,my=0;
    if(keys['KeyW']||keys['ArrowUp']){mx+=me.dirX;my+=me.dirY;}
    if(keys['KeyS']||keys['ArrowDown']){mx-=me.dirX;my-=me.dirY;}
    if(keys['KeyD']||keys['ArrowRight']){const px=-me.dirY,py=me.dirX;mx+=px;my+=py;}
    if(keys['KeyA']||keys['ArrowLeft']){const px=-me.dirY,py=me.dirX;mx-=px;my-=py;}
    if(mx||my){
      const len=Math.hypot(mx,my)||1;mx/=len;my/=len;
      const p=0.25;
      let nx=me.x+mx*spd*dt, ny=me.y;
      if(!isSolid(Math.floor(nx),Math.floor(ny))) me.x=nx;
      nx=me.x; ny=me.y+my*spd*dt;
      if(!isSolid(Math.floor(nx),Math.floor(ny))) me.y=ny;
    }
  }

  function interactDoor(){
    const tx=Math.floor(me.x),ty=Math.floor(me.y);
    const dirs=[[1,0],[-1,0],[0,1],[0,-1],[0,0]];
    for(const [dx,dy] of dirs){ const nx=tx+dx,ny=ty+dy; if(isDoor(nx,ny)){ send({type:'door'}); return; } }
  }

  function rotate(ang){ const c=Math.cos(ang),s=Math.sin(ang); const odx=me.dirX,ody=me.dirY; me.dirX=odx*c-ody*s; me.dirY=odx*s+ody*c; const opx=me.planeX,opy=me.planeY; me.planeX=opx*c-opy*s; me.planeY=opx*s+opy*c; }

  document.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='KeyE'&&joined) interactDoor();
    if(e.code==='KeyF') toggleFullscreen();
  });
  document.addEventListener('keyup',e=>{keys[e.code]=false;});
  document.addEventListener('mousemove',e=>{ if(!joined||!document.pointerLockElement)return; rotate(e.movementX*0.0032); });
  canvas.addEventListener('click',()=>{ if(joined){ try{ if(document.pointerLockElement!==canvas)canvas.requestPointerLock(); }catch(e){} } });
  function toggleFullscreen(){ try{ if(document.fullscreenElement)document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} }

  joinBtn.addEventListener('click',()=>{ if(!connected){ connect(); return; } send({type:'join'}); });
  // соединение сразу при загрузке
  connect();

  // ---- РЕНДЕР от первого лица ----
  function render(){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0b0b0d'; ctx.fillRect(0,0,W,Math.floor(H/2));
    ctx.fillStyle='#161310'; ctx.fillRect(0,Math.floor(H/2),W,Math.ceil(H/2));

    const planeX=me.planeX,planeY=me.planeY;
    const zb=new Float32Array(W);
    for(let x=0;x<W;x++){
      const camX=2*x/W-1;
      const rdx=me.dirX+planeX*camX, rdy=me.dirY+planeY*camX;
      const mapX=Math.floor(me.x),mapY=Math.floor(me.y);
      const ddx=Math.abs(1/(rdx||1e-9)), ddy=Math.abs(1/(rdy||1e-9));
      let stepX,stepY,sdx,sdy;
      if(rdx<0){stepX=-1;sdx=(me.x-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-me.x)*ddx;}
      if(rdy<0){stepY=-1;sdy=(me.y-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-me.y)*ddy;}
      let tx=mapX,ty=mapY,side=0,hit='.';
      for(let d=0;d<64;d++){
        if(sdx<sdy){sdx+=ddx;tx+=stepX;side=0;}else{sdy+=ddy;ty+=stepY;side=1;}
        if(tx<0||ty<0||tx>=COLS||ty>=ROWS) break;
        hit=MAP[ty][tx]; if(hit==='#'||hit==='C'||hit==='D') break;
      }
      const pw=(side===0)?sdx-ddx:sdy-ddy;
      const lineH=Math.min(600,Math.floor(H/(pw||0.01)));
      const ds=Math.max(0,Math.floor(-lineH/2+H/2));
      const de=Math.min(H,Math.floor(lineH/2+H/2));
      let col=hit==='#'?'#3a3a40':hit==='C'?'#3d3a30':hit==='D'?'#6b4f2a':'#888';
      if(side===1) col=shade(col,0.65);
      ctx.fillStyle=col; ctx.fillRect(x,ds,1,Math.max(1,de-ds));
      zb[x]=pw||0.01;
    }

    // другие игроки (спрайты)
    const others = players[myId] ? {} : players;
    for(const id in players){
      if(id===myId) continue;
      const p=players[id]; if(p.dead) continue;
      drawPlayerSprite(p, zb);
    }
    // мясник
    drawButcherSprite(zb);

    // виньетка
    const g=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.9);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.5)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    drawMinimap();
  }

  function project(p){
    const spx=p.x-me.x, spy=p.y-me.y;
    const inv=1/(me.planeX*me.dirY-me.dirX*me.planeY);
    const txp=inv*(me.dirY*spx-me.dirX*spy);
    const typ=inv*(-me.planeY*spx+me.planeX*spy);
    return {txp,typ};
  }

  function drawPlayerSprite(p,zb){
    const pr=project(p); if(pr.typ<=0.05) return;
    const sx=Math.floor((W/2)*(1+pr.txp/pr.typ));
    const sz=Math.abs(Math.floor(H/pr.typ));
    if(sx>=0&&sx<W && pr.typ< (zb[sx]||0)) return; // за стеной
    const rad=Math.max(2,sz*0.22);
    const yy=Math.floor(H/2)+Math.floor(sz*0.1);
    ctx.fillStyle=p.god?'#ff2a00':'#9fd';
    ctx.beginPath(); ctx.arc(sx,yy-rad*0.3,rad,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=p.god?'#fff':'#000';
    ctx.fillRect(sx-6,yy-rad*0.3-2,4,6); ctx.fillRect(sx+2,yy-rad*0.3-2,4,6);
    ctx.fillStyle='#fff';
    ctx.font=Math.max(8,rad*0.6)+'px monospace'; ctx.textAlign='center';
    ctx.fillText((id==myId)?'':'', sx, yy-rad-rad*0.4);
  }
  function drawButcherSprite(zb){
    const pr=project(butcher); if(pr.typ<=0.05) return;
    const sx=Math.floor((W/2)*(1+pr.txp/pr.typ));
    const sz=Math.abs(Math.floor(H/pr.typ));
    if(sx>=0&&sx<W && pr.typ<(zb[sx]||0)) return;
    const rad=Math.max(2,sz*0.3); const yy=Math.floor(H/2)+Math.floor(sz*0.05);
    ctx.shadowColor='#800000'; ctx.shadowBlur=30;
    ctx.fillStyle='#5a1414'; ctx.beginPath(); ctx.arc(sx,yy-rad*0.4,rad,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffe600'; ctx.beginPath(); ctx.arc(sx-6,yy-rad*0.5,Math.max(2,rad*0.12),0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(sx+6,yy-rad*0.5,Math.max(2,rad*0.12),0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c8c8c8'; ctx.fillRect(sx+rad, yy-rad*0.4, Math.max(3,rad*0.5), 3);
  }
  function drawMinimap(){
    const sc=3,ox=8,oy=8;
    ctx.save(); ctx.globalAlpha=0.8;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(ox-3,oy-3,COLS*sc+6,ROWS*sc+6);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      const c=MAP[y][x]; let col;
      if(c==='#')col='#444'; else if(c==='C')col='#865f34'; else if(c==='D')col='#a08040'; else if(c==='O')col='#777'; else continue;
      ctx.fillStyle=col; ctx.fillRect(ox+x*sc,oy+y*sc,sc,sc);
    }
    for(const id in players){ const p=players[id]; ctx.fillStyle=id===myId?'#fff':'#7ff'; ctx.fillRect(ox+Math.floor(p.x)*sc,oy+Math.floor(p.y)*sc,sc,sc); }
    ctx.fillStyle='#f22'; ctx.fillRect(ox+Math.floor(butcher.x)*sc,oy+Math.floor(butcher.y)*sc,sc,sc);
    ctx.restore();
  }

  function shade(hex,f){ const n=parseInt(hex.slice(1),16); return 'rgb('+Math.round(((n>>16)&255)*f)+','+Math.round(((n>>8)&255)*f)+','+Math.round((n&255)*f)+')'; }

  // ---- ЦИКЛ ----
  setInterval(()=>{ // сеть ~15 гц
    if(!joined||!connected||!myId) return;
    send({type:'move', x:me.x,y:me.y,dirX:me.dirX,dirY:me.dirY,planeX:me.planeX,planeY:me.planeY,closet:false,god:false});
  }, 66);

  function loop(now){
    const dt=Math.min(0.05,(now-lastTime)/1000); lastTime=now;
    if(joined) localStep(dt);
    render();
    if(joined && players[myId]){
      plistEl.innerHTML='Игроков: <b>'+Object.keys(players).length+'</b>';
    }
    requestAnimationFrame(loop);
  }

  // заявленный через init игрок — сервер сам положит меня в players. Перед этим присвоим через переменную players отправляемых.
  // Чтобы себя показывать и у других — сервер включает `me` в players с моим id.
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
